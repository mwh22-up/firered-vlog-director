name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -c constraints/test.txt -e ".[test]"
      - name: Run unit tests
        shell: pwsh
        run: .\scripts\test.ps1
      - name: Compile all Python sources
        run: python -m compileall -q src tests scripts
      - name: Run critical static checks
        run: python -m ruff check src tests scripts

  bundled-ffmpeg-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check -c constraints/test.txt -e ".[test]"
      - name: Run synthetic enhancement and full-decode smoke
        shell: pwsh
        run: .\scripts\smoke-render.ps1 -PythonExecutable python

  hyperframes-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check -c constraints/test.txt -e ".[test]"
      - name: Strict HyperFrames ProRes alpha smoke
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path '.\src').Path
          $ffmpeg = python -c "from imageio_ffmpeg import get_ffmpeg_exe; print(get_ffmpeg_exe())"
          $ffprobe = node -e "console.log(require('ffprobe-static').path)"
          python .\scripts\hyperframes-smoke.py --hyperframes .\node_modules\.bin\hyperframes.cmd --ffmpeg $ffmpeg --ffprobe $ffprobe

  libass-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg with libass and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          sudo apt-get install --yes fonts-noto-cjk
      - run: python -m pip install --disable-pip-version-check -c constraints/test.txt -e ".[test]"
      - name: Require real libass subtitles filter
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          command -v ffmpeg
          ffmpeg -version
          ffmpeg -buildconf
          ffmpeg -hide_banner -filters
          python -c "from vlog_director.ffmpeg import require_filters; require_filters('ffmpeg', {'subtitles'})"
      - name: Run real libass layout integration
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest tests.test_subtitle_layout_probe_integration -v
