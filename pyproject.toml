[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "firered-vlog-director"
version = "0.1.0"
description = "Portable director policies and protected-moment validation for a local vlog pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
analysis = [
  "faster-whisper>=1.2,<2",
  "numpy>=2,<3",
  "Pillow>=12,<13",
]
test = [
  "imageio-ffmpeg==0.6.0",
  "numpy>=2,<3",
  "Pillow>=12,<13",
]

[project.scripts]
vlog-director = "vlog_director.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vlog_director"]

[tool.hatch.build.targets.wheel.force-include]
"src/vlog_director/schemas" = "vlog_director/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
