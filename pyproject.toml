[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "firered-vlog-director"
version = "0.1.0"
description = "Portable director policies and protected-moment validation for a local vlog pipeline"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
vlog-director = "vlog_director.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vlog_director"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
